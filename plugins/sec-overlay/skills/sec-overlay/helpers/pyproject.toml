[project]
name = "sec-overlay"
version = "0.1.0"
description = "Self-contained agentic security-audit harness (deterministic core)"
# D-01: floor stays 3.12 — rule_glob.glob_match hand-rolls **-aware matching instead of
# raising this to 3.13 for the stdlib whole-path matcher.
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "ty>=0.0.1a1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sec_overlay"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["fixtures", "rules"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
exclude = ["fixtures", "rules"]
